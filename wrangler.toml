name = "dynasty-values"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# Static Assets serves everything in public/. Requests for those files never
# invoke the Worker script and are free and unlimited, which is what keeps this
# inside the free plan's 10ms-CPU-per-invocation budget.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# KV holds the published boards. Create it with:
#   npx wrangler kv namespace create VALUES
# then paste the id below.
[[kv_namespaces]]
binding = "VALUES"
id = "b5e40d170b9444c189685ed8f176f12c"

[vars]
# Optional. Leave blank; the browser remembers your league in localStorage.
DEFAULT_LEAGUE_ID = ""
DEFAULT_SLEEPER_USER = ""

# INGEST_TOKEN is a secret, not a var. Set it with:
#   npx wrangler secret put INGEST_TOKEN
