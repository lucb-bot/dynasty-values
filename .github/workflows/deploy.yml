# Deploys the site to Cloudflare.
#
# Runs whenever the code changes, and can be run by hand from the Actions tab.
# GitHub's runners have open internet access, which is why deployment happens
# here rather than from a laptop.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run tests before deploying
        run: |
          curl -sS -o .devdata/db_playerids.csv \
            https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
          npm test

      # Output is mirrored into a committed report so failures are diagnosable
      # without downloading the raw log archive, which lives on a host that is
      # not always reachable.
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          mkdir -p .ci
          {
            echo "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit code: $code"
            echo "---"
            sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' /tmp/deploy.log
          } > .ci/last-deploy.txt
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] && echo "$url" > DEPLOYED_URL.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Keeps the Worker's copy of the shared publish password in step with the
      # repository secret, so the two can never drift apart.
      - name: Sync the Worker's ingest token
        if: steps.deploy.outputs.exit == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: printf '%s' "$INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN

      - name: Commit the deploy report
        if: always()
        run: |
          git config user.name  "dynasty-values bot"
          git config user.email "noreply@github.com"
          git add -f .ci/last-deploy.txt DEPLOYED_URL.txt 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "ci: deploy report [skip ci]"
            git pull --rebase -q && git push
          fi

      - name: Fail the job if the deploy failed
        if: steps.deploy.outputs.exit != '0'
        run: |
          echo "wrangler deploy exited ${{ steps.deploy.outputs.exit }} — see .ci/last-deploy.txt"
          exit 1
