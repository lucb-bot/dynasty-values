# Nightly value refresh.
#
# Fetches FantasyCalc and DynastyProcess, scrapes KeepTradeCut, blends
# everything onto one scale, and publishes the boards to the Worker's KV store.
#
# Runs on GitHub's servers, so no machine of yours needs to be awake. The trend
# history is committed back to the repo because runners are wiped between runs
# and have nowhere else to keep it.
name: Refresh values

on:
  schedule:
    # 09:20 UTC = 5:20am Eastern. Deliberately off the hour: jobs scheduled
    # exactly on the hour get delayed by GitHub's own load.
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      skip_ktc:
        description: 'Skip the KeepTradeCut collector'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run the pipeline
        id: run
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set +e
          node pipeline/run.mjs ${{ inputs.skip_ktc && '--no-ktc' || '' }} 2>&1 | tee /tmp/pipeline.log
          code=${PIPESTATUS[0]}
          mkdir -p .ci
          {
            echo "run:       $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit code: $code"
            echo "---"
            # redact anything token-shaped before this is committed publicly
            sed -E 's#https://[^ ]*workers\.dev#[worker-url]#g; s/[A-Za-z0-9_-]{30,}/[redacted]/g' /tmp/pipeline.log
          } > .ci/last-run.txt
          exit $code

      - name: Commit run report and trend history
        if: always()
        run: |
          git config user.name  "dynasty-values bot"
          git config user.email "noreply@github.com"
          git add -f .ci/last-run.txt .history 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "ci: value refresh $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase -q && git push
          fi
