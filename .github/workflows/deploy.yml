# Deploys the site to Cloudflare.
#
# Runs whenever the code changes, and can be run by hand from the Actions tab.
# GitHub's runners have open internet access, which is why deployment happens
# here rather than from a laptop.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run tests before deploying
        run: |
          curl -sS -o .devdata/db_playerids.csv \
            https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
          npm test

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
